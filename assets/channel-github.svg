<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 88" width="284" height="88">
  <defs>
    <linearGradient id="bgGh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0a131a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="ghAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridGh" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="clipGh">
      <rect width="284" height="88" rx="9"/>
    </clipPath>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .scan { animation: scanSlide 4.8s linear infinite -0.7s; }
      @keyframes scanSlide {
        0%   { transform: translateX(-110px); }
        100% { transform: translateX(310px); }
      }
      .led { animation: ledPulse 1.8s ease-in-out infinite -0.2s; }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.28; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#clipGh)">
