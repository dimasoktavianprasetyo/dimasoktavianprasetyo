<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 88" width="284" height="88">
  <defs>
    <linearGradient id="bgIg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#170a15"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="igAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff0055" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridIg" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#ff0055" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clipIg">
      <rect width="284" height="88" rx="9"/>
    </clipPath>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .scan { animation: scanSlide 4.8s linear infinite -3.4s; }
      @keyframes scanSlide {
        0%   { transform: translateX(-110px); }
        100% { transform: translateX(310px); }
      }
      .led { animation: ledPulse 1.8s ease-in-out infinite -1.2s; }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.28; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#clipIg)">
    <rect width="284" height="88" rx="9" fill="url(#bgIg)"/>
    <rect width="284" height="88" rx="9" fill="url(#gridIg)"/>
    <rect x="0" y="0" width="90" height="88" fill="url(#igAccent)" class="scan"/>

    <rect x="1" y="1" width="282" height="86" rx="8.5" fill="none" stroke="#ff0055" stroke-opacity="0.26" stroke-width="1"/>
    <path d="M2 13 L2 2 L13 2 M271 2 L282 2 L282 13 M2 75 L2 86 L13 86 M271 86 L282 86 L282 75"
          fill="none" stroke="#ff0055" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Icon Module -->
    <circle cx="38" cy="44" r="20" fill="#ff0055" fill-opacity="0.07" stroke="#ff0055" stroke-opacity="0.34" stroke-width="1.1"/>
    <g transform="translate(26, 32)" fill="none" stroke="#ff0055" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.2" cy="6.8" r="1" fill="#ff0055" stroke="none"/>
    </g>

    <!-- Header -->
    <text x="68" y="25" class="mono" font-size="9.5" fill="#ff0055" letter-spacing="1.1" font-weight="bold">05 // INSTAGRAM</text>
    <circle cx="264" cy="21" r="2.5" fill="#ff0055" class="led"/>

    <!-- Main Handle -->
    <text x="68" y="49" class="mono" font-size="13.5" font-weight="bold" fill="#f0f6fc">@benkbenkers</text>

    <!-- Footer -->
    <line x1="68" y1="60" x2="270" y2="60" stroke="#ff0055" stroke-opacity="0.16" stroke-width="1"/>
    <text x="68" y="74" class="mono" font-size="9" fill="#8b949e">VISUAL FEED</text>
    <text x="270" y="74" class="mono" font-size="9" fill="#ff0055" text-anchor="end" font-weight="bold">[ PING → ]</text>
  </g>
</svg>

