<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 88" width="430" height="88">
  <defs>
    <linearGradient id="bgWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0d111b"/>
      <stop offset="100%" stop-color="#06080f"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridWeb" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#ffd700" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clipWeb">
      <rect width="430" height="88" rx="9"/>
    </clipPath>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .scan { animation: scanSlide 4.4s linear infinite; }
      @keyframes scanSlide {
        0%   { transform: translateX(-140px); }
        100% { transform: translateX(460px); }
      }
      .led { animation: ledPulse 1.8s ease-in-out infinite; }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.28; }
      }
      .ring-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinSlow 14s linear infinite;
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#clipWeb)">
    <rect width="430" height="88" rx="9" fill="url(#bgWeb)"/>
    <rect width="430" height="88" rx="9" fill="url(#gridWeb)"/>
    <rect x="0" y="0" width="120" height="88" fill="url(#goldAccent)" class="scan"/>

    <rect x="1" y="1" width="428" height="86" rx="8.5" fill="none" stroke="#ffd700" stroke-opacity="0.26" stroke-width="1"/>
    <path d="M2 14 L2 2 L14 2 M416 2 L428 2 L428 14 M2 74 L2 86 L14 86 M416 86 L428 86 L428 74"
          fill="none" stroke="#ffd700" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Icon Module -->
    <circle cx="44" cy="44" r="23" fill="#ffd700" fill-opacity="0.06" stroke="#ffd700" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="44" cy="44" r="20" fill="none" stroke="#ffd700" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="6 4" class="ring-spin"/>
    <g transform="translate(32, 32)" fill="none" stroke="#ffd700" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.5"/>
      <ellipse cx="12" cy="12" rx="4.2" ry="9.5"/>
      <line x1="2.5" y1="12" x2="21.5" y2="12"/>
      <path d="M4.2 7.5 Q12 9.5 19.8 7.5"/>
      <path d="M4.2 16.5 Q12 14.5 19.8 16.5"/>
    </g>

    <!-- Header Row -->
    <text x="82" y="25" class="mono" font-size="10" fill="#ffd700" letter-spacing="1.4" font-weight="bold">01 // WEB_PORTAL</text>
    <rect x="314" y="13" width="100" height="16" rx="8" fill="#ffd700" fill-opacity="0.10" stroke="#ffd700" stroke-opacity="0.32" stroke-width="0.8"/>
    <circle cx="325" cy="21" r="2.6" fill="#ffd700" class="led"/>
    <text x="333" y="24.5" class="mono" font-size="9" fill="#ffe97d" letter-spacing="0.6">HTTPS // LIVE</text>

    <!-- Main Text -->
    <text x="82" y="51" class="mono" font-size="15.5" font-weight="bold" fill="#f0f6fc" letter-spacing="0.2">dimasoktavianprasetyo.com</text>

    <!-- Footer Line -->
    <line x1="82" y1="62" x2="414" y2="62" stroke="#ffd700" stroke-opacity="0.16" stroke-width="1"/>
    <text x="82" y="75" class="mono" font-size="9.5" fill="#8b949e">PORTFOLIO • ARCHITECTURE • LABS</text>
    <text x="414" y="75" class="mono" font-size="9.5" fill="#ffd700" text-anchor="end" font-weight="bold">[ OPEN → ]</text>
  </g>
</svg>

