<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="310">
  <defs>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Consolas, monospace; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .dragon-glow { animation: breathe 4s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 0.88; }
        50%      { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Kali QTerminal Window Frame -->
  <rect width="900" height="310" rx="10" fill="#0d1117" stroke="#262c36" stroke-width="1.5"/>

  <!-- Kali Window Title Bar -->
  <path d="M1 10 A9 9 0 0 1 10 1 L890 1 A9 9 0 0 1 899 10 L899 34 L1 34 Z" fill="#161b22"/>
  <line x1="1" y1="34" x2="899" y2="34" stroke="#262c36" stroke-width="1"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5.5" fill="#27c93f"/>
  <text x="450" y="21" class="mono" font-size="11.5" fill="#8b949e" text-anchor="middle">
    dimasoktavianprasetyo@kali: ~ (zsh)
  </text>

  <!-- Kali ZSH Two-Line Prompt -->
  <text x="24" y="56" class="mono" font-size="12" fill="#367bf0">
    ┌──(<tspan fill="#e03e3e" font-weight="bold">dimasoktavianprasetyo㉿kali</tspan>)-[<tspan fill="#e6edf3" font-weight="bold">~</tspan>]
  </text>
  <text x="24" y="73" class="mono" font-size="12" fill="#367bf0">
    └─<tspan fill="#e03e3e" font-weight="bold">#</tspan> <tspan fill="#27c93f">neofetch</tspan> <tspan fill="#8b949e">--profile</tspan>
  </text>

  <!-- LEFT: Kali Linux ASCII Art Emblem -->
  <g class="mono dragon-glow" font-size="10.5" fill="#367bf0" font-weight="bold" xml:space="preserve">
    <text x="34" y="102">      ..............</text>
    <text x="34" y="114">    ..,;:ccc,.</text>
    <text x="34" y="126">  ......''';lxO.</text>
    <text x="34" y="138">.....''''..........,:ld;</text>
    <text x="34" y="150">           .';;;:::;,,.x,</text>
    <text x="34" y="162">      ..'''.            0Xxoc:,.  ...</text>
    <text x="34" y="174">  ....                ,ONkc;,;cokOdc',.</text>
    <text x="34" y="186"> .                   OMo           ':ddo.</text>
    <text x="34" y="198">                    dMc               :OO;</text>
    <text x="34" y="210">                    0M.                 .:o.</text>
    <text x="34" y="222">                    ;Wd</text>
    <text x="34" y="234">                     ;XO,</text>
    <text x="34" y="246">                       ,d0Odlc;,..</text>
    <text x="34" y="258">                           ..',;:cdOOd::,.</text>
  </g>

  <!-- RIGHT: Authentic Neofetch System & Role Output -->
  <g class="mono" font-size="11.5">
    <text x="315" y="96" font-weight="bold">
      <tspan fill="#e03e3e">dimasoktavianprasetyo</tspan><tspan fill="#e6edf3">@</tspan><tspan fill="#367bf0">kali</tspan>
    </text>
    <text x="315" y="110" fill="#484f58">--------------------------</text>

    <text x="315" y="127">
      <tspan fill="#367bf0" font-weight="bold">OS</tspan><tspan fill="#8b949e">:         </tspan><tspan fill="#e6edf3">Kali GNU/Linux Rolling x86_64</tspan>
    </text>
    <text x="315" y="144">
      <tspan fill="#367bf0" font-weight="bold">Role [1]</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#e6edf3">IT Professional of System Architect</tspan>
    </text>
    <text x="315" y="161">
      <tspan fill="#367bf0" font-weight="bold">Role [2]</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#e6edf3">SWE of Forensic Investigator</tspan>
    </text>
    <text x="315" y="178">
      <tspan fill="#367bf0" font-weight="bold">Role [3]</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#e6edf3">Blockchain Dev &amp; Cyber Specialist</tspan>
    </text>
    <text x="315" y="195">
      <tspan fill="#367bf0" font-weight="bold">Role [4]</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#e6edf3">Full-Stack Golang / Java Developer</tspan>
    </text>
    <text x="315" y="212">
      <tspan fill="#367bf0" font-weight="bold">Location</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#e6edf3">Indonesia [UTC+7]</tspan>
    </text>
    <text x="315" y="229">
      <tspan fill="#367bf0" font-weight="bold">Current Op</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">Distributed Systems, Smart Contracts &amp; DFIR</tspan>
    </text>
    <text x="315" y="246">
      <tspan fill="#367bf0" font-weight="bold">Weapons</tspan><tspan fill="#8b949e">:    </tspan><tspan fill="#e6edf3">Golang, Java, Spring, Solidity, Rust, TS, Python, K8s</tspan>
    </text>
    <text x="315" y="263">
      <tspan fill="#367bf0" font-weight="bold">Motto</tspan><tspan fill="#8b949e">:      </tspan><tspan fill="#58a6ff">"Talk is cheap. Show me the packet capture &amp; memory dump."</tspan>
    </text>
  </g>

  <!-- Classic Neofetch Color Palette Swatches -->
  <g transform="translate(315, 275)">
    <rect x="0"   y="0" width="18" height="12" rx="2" fill="#21262d"/>
    <rect x="22"  y="0" width="18" height="12" rx="2" fill="#e03e3e"/>
    <rect x="44"  y="0" width="18" height="12" rx="2" fill="#27c93f"/>
    <rect x="66"  y="0" width="18" height="12" rx="2" fill="#d29922"/>
    <rect x="88"  y="0" width="18" height="12" rx="2" fill="#367bf0"/>
    <rect x="110" y="0" width="18" height="12" rx="2" fill="#a371f7"/>
    <rect x="132" y="0" width="18" height="12" rx="2" fill="#39c5cf"/>
    <rect x="154" y="0" width="18" height="12" rx="2" fill="#e6edf3"/>
  </g>

  <!-- Bottom Active Prompt with Blinking Cursor -->
  <text x="24" y="282" class="mono" font-size="11.5" fill="#367bf0">
    ┌──(<tspan fill="#e03e3e" font-weight="bold">dimasoktavianprasetyo㉿kali</tspan>)-[<tspan fill="#e6edf3" font-weight="bold">~</tspan>]
  </text>
  <text x="24" y="297" class="mono" font-size="11.5" fill="#367bf0">
    └─<tspan fill="#e03e3e" font-weight="bold">#</tspan>
  </text>
  <rect x="52" y="286" width="8" height="13" fill="#e6edf3" class="cursor"/>
</svg>
