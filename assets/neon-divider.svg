<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .pkt1 { animation: zipRight 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pkt2 { animation: zipLeft 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite -1s; }
      @keyframes zipRight {
        0%   { transform: translateX(0px); opacity: 0; }
        20%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateX(860px); opacity: 0; }
      }
      @keyframes zipLeft {
        0%   { transform: translateX(860px); opacity: 0; }
        20%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateX(0px); opacity: 0; }
      }
    ]]></style>
  </defs>
  <line x1="20" y1="16" x2="880" y2="16" stroke="url(#lineGrad)" stroke-width="2"/>
  <rect x="10" y="13" width="32" height="6" rx="3" fill="#00ff41" class="pkt1"/>
  <rect x="10" y="14" width="24" height="4" rx="2" fill="#ff0055" class="pkt2"/>
  <polygon points="450,6 460,16 450,26 440,16" fill="#060911" stroke="#00f3ff" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 450 16" to="360 450 16" dur="6s" repeatCount="indefinite"/>
  </polygon>
</svg>
